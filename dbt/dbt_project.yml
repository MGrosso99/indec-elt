name: indec
version: "1.0.0"
profile: indec

model-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  indec:
    staging:
      +schema: staging
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: ["metabase_reader"]
  elementary:
    +schema: elementary
seeds:
  indec:
    +schema: raw
    +quote_columns: true
    ipi_manufacturero:
      +column_types:
        periodo: text
        anio: integer
        mes: integer
        indicador: text
        cuadro_web: text
        codigo_CLaNAE_2004: text
        descripcion: text
        serie: text
        tipo_de_indicador: text
        unidad_de_medida: text
        valor: numeric
        valor_null: text