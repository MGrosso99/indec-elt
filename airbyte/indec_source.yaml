version: 7.28.2

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - ipi_manufacturero

streams:
  - type: DeclarativeStream
    name: ipi_manufacturero
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: >-
          https://api.indec.gob.ar/v1/ipi_manufacturero?order=periodo,indicador,cuadro_web,codigo_CLaNAE_2004,descripcion,serie,tipo_de_indicador&limit=1000&offset=0
        http_method: GET
        request_parameters: >-
          {"order":
          "periodo,indicador,cuadro_web,codigo_CLaNAE_2004,descripcion,serie,tipo_de_indicador"}
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      paginator:
        type: DefaultPaginator
        pagination_strategy:
          type: OffsetIncrement
          page_size: 1000
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: offset
    primary_key:
      - periodo
      - indicador
      - cuadro_web
      - codigo_CLaNAE_2004
      - descripcion
      - serie
      - tipo_de_indicador
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        properties:
          periodo:
            type: string
          anio:
            type:
              - number
              - "null"
          mes:
            type:
              - number
              - "null"
          indicador:
            type: string
          cuadro_web:
            type: string
          codigo_CLaNAE_2004:
            type: string
          descripcion:
            type: string
          serie:
            type: string
          tipo_de_indicador:
            type: string
          unidad_de_medida:
            type:
              - string
              - "null"
          valor:
            type:
              - number
              - "null"
          valor_null:
            type:
              - string
              - "null"
        required:
          - periodo
          - indicador
          - cuadro_web
          - codigo_CLaNAE_2004
          - descripcion
          - serie
          - tipo_de_indicador
        additionalProperties: true

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
    properties:
      api_key:
        type: string
        title: API Key
        airbyte_secret: true
        order: 0
    additionalProperties: true

