# =============================================================================
#  INDEC ELT — stack local
# -----------------------------------------------------------------------------
#  Servicios siempre activos : postgres, airflow (init, api-server, scheduler,
#                              dag-processor, triggerer)
#  Profile "bi"              : metabase
#  Profile "monitoring"      : statsd-exporter, prometheus, grafana,
#                              postgres-exporter, cadvisor
#
#  Airbyte NO va acá: se instala aparte con `abctl` (corre en su propio cluster
#  local) y Airflow le habla vía host.docker.internal:8000.
#
#  Uso:
#    docker compose up -d                                  # core
#    docker compose --profile bi up -d                     # core + Metabase
#    docker compose --profile bi --profile monitoring up -d  # todo
# =============================================================================

name: indec-elt

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.1.0}
  image: indec-elt/airflow:${AIRFLOW_VERSION:-3.1.0}
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Métricas -> statsd-exporter -> Prometheus (si el profile monitoring no
    # está arriba, Airflow simplemente no puede enviarlas y sigue funcionando)
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Conexiones definidas por variables de entorno (no quedan en la UI ni en git)
    AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${WAREHOUSE_DB_USER}:${WAREHOUSE_DB_PASSWORD}@postgres:5432/${WAREHOUSE_DB_NAME}
    AIRFLOW_CONN_AIRBYTE_DEFAULT: ${AIRFLOW_CONN_AIRBYTE_DEFAULT}
    AIRFLOW_CONN_SLACK_ALERTS: ${AIRFLOW_CONN_SLACK_ALERTS}
    # dbt corre desde su propio virtualenv (ver airflow/Dockerfile)
    DBT_EXECUTABLE: /opt/dbt_venv/bin/dbt
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt
  extra_hosts:
    - "host.docker.internal:host-gateway"   # para llegar a Airbyte (abctl) en Linux
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
  networks: [elt]

services:
  # ---------------------------------------------------------------------------
  # Postgres: una instancia, tres bases separadas (airflow, warehouse, metabase)
  # cada una con su propio usuario. Ver infra/postgres/init-databases.sh
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      METABASE_DB_NAME: ${METABASE_DB_NAME}
      METABASE_DB_USER: ${METABASE_DB_USER}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD}
    ports:
      - "5432:5432"     # Airbyte (destino) y tu cliente SQL se conectan acá
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [elt]

  # ---------------------------------------------------------------------------
  # Airflow 3 (LocalExecutor)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # BI — profile "bi"
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:${METABASE_VERSION:-latest}
    profiles: [bi]
    restart: unless-stopped
    environment:
      # Base de aplicación de Metabase (NO el warehouse; nada de H2 embebido)
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [elt]

  # ---------------------------------------------------------------------------
  # Observabilidad de infraestructura — profile "monitoring"
  # ---------------------------------------------------------------------------
  statsd-exporter:
    image: prom/statsd-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--statsd.listen-udp=:9125", "--web.listen-address=:9102"]
    ports:
      - "9102:9102"
    networks: [elt]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [elt]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [elt]

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [elt]

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [elt]

volumes:
  postgres-data:
  airflow-logs:
  prometheus-data:
  grafana-data:

networks:
  elt:
    name: indec-elt
